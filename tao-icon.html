<!doctype html>
<html lang="vi">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Tạo biểu tượng QLCV từ logo Đoàn</title>
<style>
body{margin:0;background:#F3F6FB;color:#0F1E3D;font:15px/1.55 system-ui,-apple-system,"Segoe UI",Roboto,Arial,sans-serif}
main{max-width:760px;margin:0 auto;padding:28px 20px}
h1{color:#0B3D91;margin:0 0 6px;font-size:26px}
.panel{background:#fff;border:1px solid #DCE4F2;border-radius:16px;padding:18px 20px;margin-top:18px}
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(150px,1fr));gap:16px;margin-top:14px}
figure{margin:0;display:flex;flex-direction:column;align-items:center;gap:8px;text-align:center;font-size:13px}
canvas{width:120px;height:120px;border-radius:24px;box-shadow:0 2px 10px rgba(7,42,102,.18)}
a.btn,button{display:inline-flex;align-items:center;justify-content:center;min-height:42px;padding:0 16px;border-radius:11px;border:0;background:#FFC72C;color:#0F1E3D;font-weight:800;text-decoration:none;cursor:pointer;font-size:14px}
a.btn.sm{min-height:34px;background:#0B3D91;color:#fff;font-weight:700;font-size:13px}
label{display:block;font-weight:700;margin-bottom:6px}
.muted{color:#4A5A78}
</style>
</head>
<body>
<main>
  <h1>Tạo biểu tượng ứng dụng từ logo Đoàn</h1>
  <p class="muted">Chọn ảnh logo (PNG nền trong suốt là đẹp nhất). Công cụ chạy ngay trên máy bạn, không gửi ảnh đi đâu.</p>
  <div class="panel">
    <label for="f">Ảnh logo Đoàn</label>
    <input id="f" type="file" accept="image/png,image/jpeg,image/webp">
    <div class="grid" id="out"></div>
    <p id="next" class="muted" hidden style="margin-top:16px">Tải đủ 4 tệp, đặt cùng thư mục với <b>index.html</b> (ghi đè nếu đã có) rồi tải lên GitHub.</p>
  </div>
</main>
<script>
var SIZES = [
  { name: "icon-192.png", size: 192, note: "Android, Chrome" },
  { name: "icon-512.png", size: 512, note: "Android, Chrome" },
  { name: "icon-maskable-512.png", size: 512, note: "Android (bo tròn tự động)", maskable: true },
  { name: "icon-180.png", size: 180, note: "iPhone, iPad" }
];
function draw(img, size, maskable) {
  var c = document.createElement("canvas"); c.width = size; c.height = size;
  var g = c.getContext("2d");
  g.fillStyle = "#0B3D91"; g.fillRect(0, 0, size, size);              // nền xanh Đoàn
  var circle = size * (maskable ? 0.70 : 0.82);                        // maskable: giữ trong vùng an toàn 80%
  g.fillStyle = "#FFFFFF"; g.beginPath(); g.arc(size / 2, size / 2, circle / 2, 0, Math.PI * 2); g.fill();
  var box = circle * 0.86, s = Math.min(box / img.width, box / img.height), w = img.width * s, h = img.height * s;
  g.save(); g.beginPath(); g.arc(size / 2, size / 2, circle / 2, 0, Math.PI * 2); g.clip();
  g.drawImage(img, (size - w) / 2, (size - h) / 2, w, h); g.restore();
  return c;
}
document.getElementById("f").addEventListener("change", function (e) {
  var file = e.target.files[0]; if (!file) return;
  var img = new Image();
  img.onload = function () {
    var out = document.getElementById("out"); out.innerHTML = "";
    SIZES.forEach(function (s) {
      var c = draw(img, s.size, s.maskable);
      var fig = document.createElement("figure");
      var a = document.createElement("a"); a.className = "btn sm"; a.download = s.name; a.href = c.toDataURL("image/png"); a.textContent = "Tải " + s.name;
      var cap = document.createElement("figcaption"); cap.textContent = s.size + "×" + s.size + " · " + s.note;
      fig.appendChild(c); fig.appendChild(cap); fig.appendChild(a); out.appendChild(fig);
    });
    document.getElementById("next").hidden = false;
  };
  img.src = URL.createObjectURL(file);
});
</script>
</body>
</html>
